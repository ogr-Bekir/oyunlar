<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Ayna – Görünmez lazer oyunu</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; height: 100dvh; background: #0a0d1f; overflow: hidden; touch-action: none; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
  body { position: fixed; inset: 0; }
  #safe { position: fixed; top: 0; padding-top: env(safe-area-inset-top, 0px); visibility: hidden; pointer-events: none; }
  body { font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif; color: #f4efe6; -webkit-user-select: none; user-select: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #ui { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; pointer-events: none; padding: 24px; box-sizing: border-box; }
  #ui h1 { font-size: clamp(44px, 12vw, 80px); margin: 0 0 8px; letter-spacing: 4px; color: #7df9ff; text-shadow: 0 0 26px rgba(125,249,255,.5); }
  #ui p { margin: 4px 0; font-size: clamp(15px, 4vw, 19px); line-height: 1.5; max-width: 340px; color: #c9cdee; }
  #ui .big { font-size: clamp(54px, 16vw, 96px); font-weight: 700; color: #fff; margin: 0; text-shadow: 0 0 24px rgba(255,93,115,.5); }
  #ui .go { margin-top: 18px; font-size: 18px; color: #ffd166; animation: nabiz 1.4s ease-in-out infinite; }
  #fire { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(26px + env(safe-area-inset-bottom, 0px)); padding: 16px 54px; font: 700 22px "Trebuchet MS", system-ui, sans-serif; letter-spacing: 2px; color: #fff; background: #ff5d73; border: 0; border-radius: 40px; box-shadow: 0 0 28px rgba(255,93,115,.55); cursor: pointer; }
  #fire:active { transform: translateX(-50%) scale(.95); }
  #fire[hidden] { display: none; }
  @keyframes nabiz { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { #ui .go { animation: none; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"></div>
<button id="fire" hidden>ATEŞ 🔥</button>
<div id="safe"></div>

<script>
(() => {
  const cv = document.getElementById('c'), cx = cv.getContext('2d');
  const ui = document.getElementById('ui'), fireBtn = document.getElementById('fire');
  const TAU = Math.PI * 2, mod = (a, m) => ((a % m) + m) % m, norm = a => mod(a + Math.PI, TAU) - Math.PI;
  let W, H, S, DPR, CX, CY;
  let phase = 'menu', lvl = 1, lives = 3, score = 0, best = 0, overAt = 0;
  let nL, nM, nT, L, M, T, Tr, ang = 0, parts = [], beam = null, toast = null, wait = null, fixAnim = null, drag = null, keys = {};
  try { best = +localStorage.getItem('ayna-best') || 0; } catch (e) {}

  let SAFE = 0;
  function resize() {
    DPR = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; S = Math.min(W, H);
    SAFE = parseFloat(getComputedStyle(document.getElementById('safe')).paddingTop) || 0;
    cv.width = W * DPR; cv.height = H * DPR; cx.setTransform(DPR, 0, 0, DPR, 0, 0);
    place();
  }
  function place() {
    if (!nL) return;
    const P = n => ({ x: n.u * W, y: n.v * H });
    L = P(nL); M = P(nM); T = P(nT); Tr = S * (.06 - Math.min(lvl - 1, 10) * .0025);
  }
  addEventListener('resize', resize); addEventListener('orientationchange', () => setTimeout(resize, 200));
  if (window.visualViewport) visualViewport.addEventListener('resize', resize);
  addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('visibilitychange', () => { last = performance.now(); });

  const unit = (a, b) => { const l = Math.hypot(a.x - b.x, a.y - b.y) || 1; return { x: (a.x - b.x) / l, y: (a.y - b.y) / l }; };
  // Hedefi vuran ayna açısı (ayna çizgisinin yönü)
  function solve() {
    const d = unit(M, L), e = unit(T, M);
    return Math.atan2(e.y - d.y, e.x - d.x) - Math.PI / 2;
  }
  function trace(phi) {
    const d = unit(M, L), n = { x: -Math.sin(phi), y: Math.cos(phi) }, dn = d.x * n.x + d.y * n.y;
    const e = { x: d.x - 2 * dn * n.x, y: d.y - 2 * dn * n.y };
    const tx = T.x - M.x, ty = T.y - M.y, ts = tx * e.x + ty * e.y, dist = Math.hypot(tx - ts * e.x, ty - ts * e.y);
    const hit = ts > 0 && dist < Tr;
    const len = hit ? ts - Math.sqrt(Tr * Tr - dist * dist) : Math.hypot(W, H) * 1.2;
    return { hit, dist, end: { x: M.x + e.x * len, y: M.y + e.y * len } };
  }
  const errDeg = () => Math.abs(mod(ang - solve() + Math.PI / 2, Math.PI) - Math.PI / 2) * 180 / Math.PI;

  function newLevel() {
    const r = (a, b) => a + Math.random() * (b - a);
    for (let i = 0; i < 300; i++) {
      nM = { u: r(.35, .65), v: r(.42, .58) }; nL = { u: r(.1, .9), v: r(.17, .76) }; nT = { u: r(.1, .9), v: r(.17, .76) };
      place();
      const d = unit(M, L), e = unit(T, M), dot = d.x * e.x + d.y * e.y;
      if (Math.hypot(L.x - M.x, L.y - M.y) > S * .3 && Math.hypot(T.x - M.x, T.y - M.y) > S * .3 &&
          Math.hypot(L.x - T.x, L.y - T.y) > S * .25 && dot < .5 && dot > -.76) break; // çözülebilir yerleşim
    }
    const sol = solve();
    do { ang = Math.random() * Math.PI; } while (Math.abs(mod(ang - sol + Math.PI / 2, Math.PI) - Math.PI / 2) < .35);
    beam = null; toast = lvl === 1 ? { txt: 'Işın görünmez. Aynayı göz kararı çevir!', col: '#c9cdee', t: 0, life: 1e9 } : null;
    setPhase('aim');
  }
  function setPhase(p) { phase = p; fireBtn.hidden = p !== 'aim'; }
  const later = (s, fn) => { wait = { t: s, fn }; };
  const say = (txt, col, life = 2.2) => { toast = { txt, col, t: 0, life }; };
  function burst(x, y, col, n) {
    for (let i = 0; i < n; i++) { const a = Math.random() * TAU, v = (Math.random() * .6 + .15) * S; parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, l: 1, col }); }
  }

  function menu() {
    setPhase('menu');
    ui.innerHTML = '<h1>AYNA</h1><p>Lazer görünmez. Aynayı çevir, ateş et, hedefi vur.</p><p>Iskalarsan ayna doğru açıyı sana gösterir.</p><p class="go">Başlamak için dokun</p>';
  }
  function start() { lvl = 1; lives = 3; score = 0; ui.innerHTML = ''; newLevel(); }
  function gameOver() {
    setPhase('over'); overAt = performance.now();
    const rec = score > best; if (rec) { best = score; try { localStorage.setItem('ayna-best', best); } catch (e) {} }
    ui.innerHTML = '<p>Oyun bitti</p><p class="big">' + score + '</p><p>' + (rec && score > 0 ? 'Yeni rekor! 🏆' : 'En iyi: ' + best) + '</p><p class="go">Tekrar denemek için dokun</p>';
  }

  function shoot(phi, col, onEnd) {
    const tr = trace(phi), l1 = Math.hypot(M.x - L.x, M.y - L.y), l2 = Math.hypot(tr.end.x - M.x, tr.end.y - M.y);
    beam = { end: tr.end, l1, total: l1 + l2, prog: 0, col, onEnd, tr, spark: false };
  }
  function fire() {
    if (phase !== 'aim') return;
    setPhase('busy'); toast = null;
    shoot(ang, '#ff5d73', tr => {
      if (tr.hit) {
        const pts = 100 + Math.round(100 * (1 - tr.dist / Tr)), perfect = tr.dist < Tr * .35;
        score += pts + (perfect ? 50 : 0);
        burst(T.x, T.y, '#ffd166', 36); say((perfect ? 'Mükemmel! +' : 'Vurdun! +') + (pts + (perfect ? 50 : 0)), '#ffd166');
        later(1.3, () => { lvl++; newLevel(); });
      } else {
        lives--; say('Iskaladın · sapma ' + errDeg().toFixed(1) + '°', '#ff5d73', 3);
        later(1.1, () => { beam.live = true; fixMirror(); });
      }
    });
  }
  function fixMirror() {
    say('Doğru açı böyle olmalıydı', '#7dffb2', 3);
    const sol = solve(), diff = mod(sol - ang + Math.PI / 2, Math.PI) - Math.PI / 2;
    fixAnim = { from: ang, diff, t: 0, dur: 1.4 };
  }
  function afterFix() {
    beam.col = '#7dffb2'; burst(T.x, T.y, '#7dffb2', 30);
    later(1.5, () => { if (lives <= 0) gameOver(); else { lvl++; newLevel(); } });
  }
  const mixCol = k => `rgb(${Math.round(255 - 130 * k)},${Math.round(93 + 162 * k)},${Math.round(115 + 63 * k)})`;

  // Girdi: aynanın etrafında parmağı döndür (uzaklaştıkça ince ayar), ya da ok tuşları
  cv.addEventListener('pointerdown', e => {
    if (phase === 'menu') { start(); return; }
    if (phase === 'over') { if (performance.now() - overAt > 500) start(); return; }
    if (phase === 'aim') drag = { a: Math.atan2(e.clientY - M.y, e.clientX - M.x), x: e.clientX, id: e.pointerId };
  });
  addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    const a = Math.atan2(e.clientY - M.y, e.clientX - M.x);
    if (Math.hypot(e.clientX - M.x, e.clientY - M.y) > S * .05) ang += norm(a - drag.a); else ang += (e.clientX - drag.x) * .01;
    drag.a = a; drag.x = e.clientX;
  });
  addEventListener('pointerup', () => { drag = null; });
  addEventListener('pointercancel', () => { drag = null; });
  fireBtn.addEventListener('click', fire);
  addEventListener('keydown', e => {
    if (e.code === 'ArrowLeft' || e.code === 'ArrowRight') { keys[e.code] = true; e.preventDefault(); }
    if ((e.code === 'Space' || e.code === 'Enter') && !e.repeat) {
      e.preventDefault();
      if (phase === 'menu') start(); else if (phase === 'over' && performance.now() - overAt > 500) start(); else fire();
    }
  });
  addEventListener('keyup', e => { delete keys[e.code]; });

  function update(dt) {
    for (const q of parts) { q.x += q.vx * dt; q.y += q.vy * dt; q.l -= dt * 1.6; }
    parts = parts.filter(q => q.l > 0);
    if (toast) toast.t += dt;
    if (phase === 'aim') ang += ((keys.ArrowRight ? 1 : 0) - (keys.ArrowLeft ? 1 : 0)) * dt * .9;
    if (wait && (wait.t -= dt) <= 0) { const f = wait.fn; wait = null; f(); }
    if (beam && beam.prog < beam.total) {
      beam.prog += S * 3.2 * dt;
      if (!beam.spark && beam.prog >= beam.l1) { beam.spark = true; burst(M.x, M.y, '#ffffff', 10); }
      if (beam.prog >= beam.total) { beam.prog = beam.total; const f = beam.onEnd; f(beam.tr); }
    }
    if (fixAnim) {
      fixAnim.t += dt; const k = Math.min(1, fixAnim.t / fixAnim.dur), e = k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
      ang = fixAnim.from + fixAnim.diff * e;
      if (beam) beam.col = mixCol(e);
      if (k >= 1) { fixAnim = null; afterFix(); }
    }
    if (beam && beam.live) { // ışın aynayla birlikte döner
      const tr = trace(ang);
      beam.tr = tr; beam.end = tr.end; beam.total = beam.l1 + Math.hypot(tr.end.x - M.x, tr.end.y - M.y); beam.prog = beam.total;
    }
  }

  function draw() {
    const g = cx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.hypot(W, H) / 2);
    g.addColorStop(0, '#141a3d'); g.addColorStop(1, '#070918'); cx.fillStyle = g; cx.fillRect(0, 0, W, H);
    cx.fillStyle = 'rgba(160,180,255,.12)';
    for (let x = S * .05; x < W; x += S * .08) for (let y = S * .05; y < H; y += S * .08) cx.fillRect(x, y, 2, 2);
    if (!M || phase === 'menu') return;

    // Dönüş halkası
    cx.strokeStyle = 'rgba(125,249,255,.22)'; cx.lineWidth = 2; cx.setLineDash([4, 10]);
    cx.beginPath(); cx.arc(M.x, M.y, S * .14, 0, TAU); cx.stroke(); cx.setLineDash([]);

    // Hedef
    const pulse = 1 + Math.sin(performance.now() / 400) * .03;
    [1, .66, .33].forEach((k, i) => { cx.fillStyle = i % 2 ? '#fff3c4' : '#ffd166'; cx.shadowColor = '#ffd166'; cx.shadowBlur = i ? 0 : 20; cx.beginPath(); cx.arc(T.x, T.y, Tr * k * pulse, 0, TAU); cx.fill(); });
    cx.shadowBlur = 0;

    // Lazer kaynağı
    const d = unit(M, L);
    cx.strokeStyle = '#ff5d73'; cx.lineWidth = S * .026; cx.lineCap = 'round'; cx.shadowColor = '#ff5d73'; cx.shadowBlur = 14;
    cx.beginPath(); cx.moveTo(L.x, L.y); cx.lineTo(L.x + d.x * S * .055, L.y + d.y * S * .055); cx.stroke();
    cx.fillStyle = '#2a1020'; cx.beginPath(); cx.arc(L.x, L.y, S * .032, 0, TAU); cx.fill();
    cx.strokeStyle = '#ff5d73'; cx.lineWidth = 4; cx.stroke(); cx.shadowBlur = 0;

    // Ayna
    const h = S * .1, ux = Math.cos(ang), uy = Math.sin(ang);
    cx.strokeStyle = '#7df9ff'; cx.lineWidth = S * .016; cx.shadowColor = '#7df9ff'; cx.shadowBlur = 18;
    cx.beginPath(); cx.moveTo(M.x - ux * h, M.y - uy * h); cx.lineTo(M.x + ux * h, M.y + uy * h); cx.stroke();
    cx.fillStyle = '#fff'; cx.beginPath(); cx.arc(M.x, M.y, S * .012, 0, TAU); cx.fill(); cx.shadowBlur = 0;

    // Işın
    if (beam) {
      cx.save(); cx.globalCompositeOperation = 'lighter'; cx.lineCap = 'round'; cx.lineJoin = 'round';
      const pts = [L, M, beam.end];
      [[S * .035, .14, beam.col], [S * .016, .35, beam.col], [S * .006, 1, '#ffffff']].forEach(([w, a, c]) => {
        cx.globalAlpha = a; cx.strokeStyle = c; cx.lineWidth = w; cx.beginPath(); cx.moveTo(L.x, L.y);
        let rem = beam.prog, cur = L;
        for (let i = 1; i < 3 && rem > 0; i++) {
          const n = pts[i], len = Math.hypot(n.x - cur.x, n.y - cur.y), k = Math.min(1, rem / len);
          cx.lineTo(cur.x + (n.x - cur.x) * k, cur.y + (n.y - cur.y) * k); rem -= len; cur = n;
        }
        cx.stroke();
      });
      cx.restore();
    }
    for (const q of parts) { cx.globalAlpha = Math.max(q.l, 0); cx.fillStyle = q.col; cx.fillRect(q.x, q.y, 4, 4); }
    cx.globalAlpha = 1;

    // HUD
    const top = 34 + SAFE, fs = Math.max(15, S * .045); cx.font = `700 ${fs}px "Trebuchet MS", system-ui, sans-serif`; cx.textBaseline = 'middle';
    cx.textAlign = 'left'; cx.fillStyle = '#c9cdee'; cx.fillText('Bölüm ' + lvl, 20, top);
    cx.textAlign = 'right'; cx.fillStyle = '#ffd166'; cx.fillText('⭐ ' + score, W - 20, top);
    cx.textAlign = 'center'; cx.fillStyle = '#ff5d73'; cx.fillText('♥'.repeat(Math.max(lives, 0)) + '♡'.repeat(3 - Math.max(lives, 0)), W / 2, top);

    // Bilgi yazısı
    if (toast && toast.t < toast.life) {
      cx.globalAlpha = Math.min(1, toast.life - toast.t, toast.t * 5); cx.fillStyle = toast.col; cx.font = `700 ${S * .05}px "Trebuchet MS", system-ui, sans-serif`;
      cx.fillText(toast.txt, W / 2, Math.max(H * .115, top + 44), W - 30); cx.globalAlpha = 1;
    }
  }

  var last = performance.now();
  function loop(now) {
    const dt = Math.min((now - last) / 1000, .05); last = now;
    update(dt); draw(); requestAnimationFrame(loop);
  }
  resize(); nL = { u: .15, v: .3 }; nM = { u: .5, v: .5 }; nT = { u: .85, v: .3 }; place();
  menu(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
